<title>Отдел продаж Кадкам</title>
<style>
:root{--color-fg:#1d2430;--color-fg-muted:#5d6675;--color-bg:#f6f7f9;--color-panel:#ffffff;--color-border-line:#e1e4ea;--color-ok:#1f7a4d;--color-warn:#a36200;--color-bad:#b3261e;
--cds-chart-grid:#eceef2;--cds-chart-muted:#b9c0cc;--cds-surface-popover:#ffffff;--cds-border:#d5d9e0;--cds-shadow-popover:0 4px 16px rgba(20,30,50,.12);--cds-text-secondary:#5d6675;
--c0:#2b6cb0;--c1:#d08a2c;
--font-anthropic-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-anthropic-serif:Georgia,"Times New Roman",serif;
--cds-font-size-caption:12.5px;--cds-font-size-body:14px;--cds-font-size-heading:16px;--cds-font-size-title:26px;--cds-font-weight-medium:600;
--cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:14px;--cds-gap-lg:22px;--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-lg:18px;--cds-radius:10px;--cds-dur-slow:.3s}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--color-fg:#e6e9ef;--color-fg-muted:#9aa3b2;--color-bg:#14171c;--color-panel:#1c2027;--color-border-line:#2c323c;--color-ok:#5cc58f;--color-warn:#e0a54a;--color-bad:#f07167;--cds-chart-grid:#272c35;--cds-chart-muted:#4a5260;--cds-surface-popover:#232832;--cds-border:#363d49;--cds-text-secondary:#9aa3b2;--c0:#6aa6e8;--c1:#e3a857;color-scheme:dark}}
:root[data-theme="dark"]{--color-fg:#e6e9ef;--color-fg-muted:#9aa3b2;--color-bg:#14171c;--color-panel:#1c2027;--color-border-line:#2c323c;--color-ok:#5cc58f;--color-warn:#e0a54a;--color-bad:#f07167;--cds-chart-grid:#272c35;--cds-chart-muted:#4a5260;--cds-surface-popover:#232832;--cds-border:#363d49;--cds-text-secondary:#9aa3b2;--c0:#6aa6e8;--c1:#e3a857;color-scheme:dark}
body{background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans)}
.wrap{max-width:1200px;margin-inline:auto;padding-block:20px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.dash-skeleton{color:transparent;background:var(--color-border-line);border-radius:6px}
</style><style>
.kd .tabs{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--color-bg);padding-block:8px;border-bottom:1px solid var(--color-border-line)}
.kd .tabs a{color:var(--color-fg);text-decoration:none;padding:6px 12px;border:1px solid var(--color-border-line);border-radius:999px;font-size:13.5px;background:var(--color-panel);display:inline-flex;gap:6px;align-items:center}
.kd .tabs a[aria-current=page]{background:var(--color-fg);color:var(--color-bg);border-color:var(--color-fg)}
.kd .tabs a[aria-current=page] .pill{color:inherit;border-color:currentColor}
.kd .tabs a:focus-visible{outline:2px solid var(--c0);outline-offset:2px}
.kd .page{display:grid;gap:var(--cds-gap-lg)}.kd .page[hidden]{display:none!important}
.kd .pill.new{color:var(--c0)}
.kd .mh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.kd .mh>div:first-child{min-width:0;flex:1 1 30rem}
.kd .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-fg-muted);margin:0 0 4px}
.kd .score{display:flex;align-items:center;gap:12px}
.kd .pill.big{font-size:22px;padding:4px 14px;font-weight:600}
.kd .sc{font-family:var(--font-anthropic-serif);font-size:40px;line-height:1}.kd .sc small{font-size:16px;color:var(--color-fg-muted)}
.kd .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kd h3{font-size:12.5px;font-weight:600;color:var(--color-fg-muted);margin:0 0 4px}
.kd .bv{font-size:11px;fill:var(--color-fg);text-anchor:middle;font-variant-numeric:tabular-nums}
.kd .bl{font-size:10.5px;fill:var(--color-fg-muted);text-anchor:middle}
.kd .b0{fill:var(--c0)}.kd .b1{fill:var(--c1)}.kd .b2{fill:var(--cds-chart-muted)}
.kd .sw.b0{background:var(--c0)}.kd .sw.b1{background:var(--c1)}
.kd .parts{display:grid;gap:5px}
.kd .pr{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr 2.5rem;gap:8px;align-items:center;font-size:12.5px}
.kd .pr span{color:var(--color-fg-muted)}.kd .pr b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.kd .pt{height:9px;background:var(--color-border-line);border-radius:3px;overflow:hidden}.kd .pt i{display:block;height:100%;background:var(--c0)}
.kd .abrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kd .abx{border:1px solid var(--color-border-line);border-radius:6px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.kd .cat{display:inline-block;min-width:18px;text-align:center;border-radius:3px;font-weight:700;font-size:11.5px;padding:0 3px;border:1px solid var(--color-border-line)}
.kd .cat.cA{background:var(--c0);color:var(--color-panel);border-color:var(--c0)}.kd .cat.cB{color:var(--c0);border-color:var(--c0)}.kd .cat.c—{color:var(--color-fg-muted)}
.kd td .sub{display:block;font-size:11px;color:var(--color-fg-muted)}
.kd td.sm{font-size:11.5px;color:var(--color-fg-muted);min-width:9rem}
.kd .hs{overflow-x:auto}
.kd .cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:18px}
.kd .cols3 ul,.kd .cols3 ol{margin:0;padding-left:1.2rem;display:grid;gap:7px;line-height:1.45;font-size:14px}
.kd h3.g{color:var(--color-ok);font-size:15px}.kd h3.r{color:var(--color-bad);font-size:15px}
.kd .recb{background:var(--color-bg);border-radius:8px;padding:12px 14px}.kd .recb h3{color:var(--c0);font-size:15px}
@media (max-width:560px){.kd .trio{grid-template-columns:1fr 1fr}}
.kd .page .tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr))}
.kd .tabs .tsep{width:1px;align-self:stretch;background:var(--color-border-line);margin-inline:4px}
.kd .banner{border:1px solid var(--c0);border-left-width:4px;border-radius:8px;padding:10px 14px;background:var(--color-panel);font-size:14px}
.kd td.up{color:var(--color-ok)}.kd td.down{color:var(--color-bad)}
.kd .gbar{display:grid;grid-template-columns:minmax(9rem,13rem) 1fr 7.5rem;gap:8px;align-items:center;font-size:12.5px;margin-bottom:6px}
.kd .gbar .tr{position:relative;height:18px;background:var(--color-border-line);border-radius:3px;overflow:hidden}
.kd .gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--c0)}.kd .gbar .tr i.p25{background:var(--cds-chart-muted);height:6px;top:auto;bottom:0}
.kd .gbar .tr em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--color-fg)}
.kd .gbar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
</style><style>
html:root,html:root:not([data-theme="light"]),html:root[data-theme]{color-scheme:dark;
 --color-fg:#ffffff;--color-fg-muted:#bbbaba;--color-bg:#1b1a1a;--color-panel:#242222;--color-border-line:#3d3a3a;
 --color-ok:#7fd67c;--color-warn:#ffb45c;--color-bad:#ff7a7a;--c0:#d0602c;--c1:#bef127;
 --cds-chart-muted:#5a5555;--cds-chart-grid:#3d3a3a;--cds-border:#3d3a3a;--cds-surface-popover:#2d2b2b;--cds-text-secondary:#bbbaba;
 --font-anthropic-sans:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-anthropic-serif:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html,body{background:#1b1a1a!important;color:#fff}
.kd h1{font-weight:700;letter-spacing:-.01em}
.kd .tabs{background:#1b1a1a}

.kd .tabs a[aria-current=page]{background:#bef127;color:#272727;border-color:#bef127;font-weight:600}
.kd .tabs a[aria-current=page] .pill{color:#272727;border-color:#272727}
.kd .card{background:#242222;border-color:#3d3a3a}
.kd .recb{background:#2d2b2b}
.kd .banner{background:#2d2b2b;border-color:#e0561a}
.kd .cat.cA{color:#1b1a1a}
.kh{display:flex;align-items:center;gap:14px;padding:10px 0 8px;flex-wrap:wrap}
.kh .klogo{height:46px;width:auto;border-radius:6px}
.kh h1{margin:0;font-size:24px;font-weight:700;color:#fff}
.kh .ks{font-size:13px;color:#bbbaba;margin-top:2px}
.kh .kr{margin-left:auto;display:flex;gap:8px}
.kbtn{background:#2d2b2b;border:1px solid #3d3a3a;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;color:#bbbaba;cursor:pointer;text-decoration:none;white-space:nowrap}
.kbtn.acc{background:#bef127;color:#272727;border-color:#bef127;font-weight:600}
.kline{height:3px;background:linear-gradient(90deg,#e0561a 0 18%,#bef127 18% 100%);border-radius:2px;opacity:.9;margin-bottom:6px}
.kd .note.live{color:#8d8c8c}
</style><style>
.kd{font-family:var(--font-anthropic-sans);color:var(--color-fg);display:grid;gap:var(--cds-gap-lg)}
.kd h1{font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);margin:0;text-wrap:balance}
.kd h2{font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium);margin:0}
.kd .lede{color:var(--color-fg-muted);margin:var(--cds-gap-xs) 0 0;max-width:70ch;line-height:1.5}
.kd .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr));gap:var(--cds-gap-md)}
.kd .card{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-lg);min-width:0;display:grid;gap:var(--cds-gap-sm);align-content:start}
.kd .tile .lab{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.kd .tile .big{font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);font-variant-numeric:tabular-nums}
.kd .tile .sub{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.kd .note{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);margin:0;line-height:1.45}
.kd .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:var(--cds-gap-md)}
.kd .up{color:var(--color-ok)} .kd .down{color:var(--color-bad)} .kd .warn{color:var(--color-warn)}
.kd .scroll{overflow:auto;max-height:32rem}
.kd table{border-collapse:collapse;width:100%;font-size:var(--cds-font-size-caption);font-variant-numeric:tabular-nums}
.kd th,.kd td{padding:6px 8px;border-bottom:1px solid var(--color-border-line);text-align:right;white-space:nowrap}
.kd th:first-child,.kd td:first-child,.kd td.t,.kd th.t{text-align:left}
.kd td.wrap{white-space:normal;min-width:14rem}
.kd th{position:sticky;top:0;background:var(--color-panel);color:var(--color-fg-muted);font-weight:var(--cds-font-weight-medium);z-index:1}
.kd th button{all:unset;cursor:pointer}
.kd th button:focus-visible{outline:2px solid var(--color-fg)}
.kd .pill{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--color-border-line);font-size:var(--cds-font-size-caption);margin:1px 2px 1px 0;white-space:nowrap}
.kd .pill.bad{color:var(--color-bad)} .kd .pill.warn{color:var(--color-warn)} .kd .pill.ok{color:var(--color-ok)}
.kd input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--color-border-line);border-radius:var(--cds-radius);background:var(--color-bg);color:var(--color-fg);max-width:20rem;width:100%}
.kd .chart{position:relative;min-height:18rem}
.kd .tip{position:absolute;background:var(--cds-surface-popover);border:1px solid var(--cds-border);border-radius:var(--cds-radius);box-shadow:var(--cds-shadow-popover);padding:var(--cds-pad-xs) var(--cds-pad-sm);font-size:var(--cds-font-size-caption);pointer-events:none;white-space:nowrap}
.kd .tip .h{color:var(--cds-text-secondary)}
.kd .legend{display:flex;flex-wrap:wrap;gap:var(--cds-gap-md);font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.kd .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.kd .heat td{text-align:center}
.kd [data-dash-source-state=empty]{color:transparent}
.kd [data-dash-source-state=refreshing]{opacity:.5;transition:opacity var(--cds-dur-slow)}
.kd .fail{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);min-height:6rem}
.kd .fail::before{content:"";width:.375rem;height:.375rem;border-radius:50%;background:var(--color-bad)}
.kd details summary{cursor:pointer;font-weight:var(--cds-font-weight-medium)}
.kd details ul{margin:var(--cds-gap-sm) 0 0;padding-left:1.2rem;line-height:1.5;max-width:75ch}
</style>
<style>

/* ---------- общие утилиты ---------- */
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function num(s){
  if(s==null) return null;
  const t=String(s).replace(/[\s  %]/g,'').replace(',', '.');
  if(!/^-?\d+(\.\d+)?$/.test(t)) return null;
  return parseFloat(t);
}
const normTxt = s => String(s||'').toUpperCase().replace(/Ё/g,'Е').replace(/\s+/g,' ').trim();
function normOrg(s){
  return normTxt(s).replace(/["«»“”]/g,'')
    .replace(/\s*\(\s*/g,' (').replace(/\s*\)/g,')')
    .replace(/^(АО|ООО|ПАО|ОАО|ЗАО|ФГУП|АО НПП|НПП АО)\s+/,'').replace(/\s+(АО|ООО|ПАО|ОАО|ЗАО)$/,'')
    .replace(/\s+/g,' ').trim();
}
const personKey = s => normTxt(String(s).replace(/\(.*$/,'')).split(' ').slice(0,2).join(' ');
function rename(raw){
  const k=personKey(raw);
  for(const [from,to] of Object.entries(CONFIG.RENAME||{})) if(personKey(from)===k) return to;
  return raw;
}
const isLeader = n => (CONFIG.LEADERS||[]).some(x=>personKey(x)===personKey(n));
function shortRole(r){
  if(!r) return r;
  return String(r).replace(/^Руководитель\s+направлени[яе]\s*/i,'РН ').replace(/["«»“”]/g,'')
    .replace(/инструмент/gi,'инстр.').replace(/оборудование/gi,'обор.').replace(/^Руководитель\s+/i,'Рук. ').replace(/\s+/g,' ').trim();
}
const roleOf = (n,fallback) => isLeader(n)?(roleFor(n)||fallback||''):(fallback||roleFor(n)||'');
const LEADER_SEP = cols => `<div class="sep">Вне зачёта<\/div>`;
const isHidden = n => (CONFIG.HIDE||[]).some(x=>personKey(x)===personKey(n));
const isX = s => /^[хx]$/i.test(String(s).trim());
const pad=n=>String(n).padStart(2,'0');
const sum=a=>a.reduce((s,x)=>s+(x||0),0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtM(x){
  const a=Math.abs(x||0), sg=x<0?'−':'';
  if(a>=1e6) return sg+(a/1e6).toLocaleString('ru-RU',{maximumFractionDigits:a>=1e8?0:1,minimumFractionDigits:a>=1e8?0:1})+' млн';
  if(a>=1e3) return sg+Math.round(a/1e3).toLocaleString('ru-RU')+' тыс';
  return sg+Math.round(a).toLocaleString('ru-RU')+' ₽';
}

/* ---------- ВСТРЕЧИ и АКБ: вкладка месяца ---------- */
function roleFor(name){
  const k=Object.keys(CONFIG.ROLES).find(x=>x.replace(/ё/g,'е').toLowerCase()===name.replace(/ё/g,'е').toLowerCase());
  return k?CONFIG.ROLES[k]:'';
}
/* Колонки: A ФИО, B должность, C клиент АКБ, D объём продаж АКБ, E план встреч, F факт встреч, G предприятие. */
function parseSheet(rows){
  const people=[]; let cur=null;
  for(const r of rows){
    const a=(r[0]||'').trim();
    if(/ФИО/i.test(a)) continue;
    if(a && /[А-Яа-яЁё]{2,}/.test(a) && !isX(a)){
      const orig=a.replace(/\s+/g,' '), nm=rename(orig);
      const role=(nm!==orig && /^РН /.test(nm))?'':roleOf(orig,(r[1]||'').trim());
      cur={name:nm, role:shortRole(role), plan:num(r[4]), sub:null, visits:[], akb:[]};
      people.push(cur);
    }
    if(!cur) continue;
    const n=num(r[5]); const org=(r[6]||'').trim();
    if(n!=null && org && !isX(org)){ cur.visits.push({org:normOrg(org), count:n}); }
    else if(n!=null && !org){ cur.sub=n; }
    const cl=(r[2]||'').trim();
    if(cl && !isX(cl) && /[A-Za-zА-Яа-яЁё]/.test(cl) && !/АКБ/i.test(cl)) cur.akb.push({client:cl, amount:num(r[3])||0});
  }
  for(const p of people){
    const m=new Map();
    for(const v of p.visits){ m.set(v.org,(m.get(v.org)||0)+v.count); }
    p.visits=[...m].map(([org,count])=>({org,count})).sort((x,y)=>y.count-x.count||x.org.localeCompare(y.org,'ru'));
    const s=p.visits.reduce((s,v)=>s+v.count,0);
    p.fact=Math.max(s, p.sub||0);
    p.unnamed=p.fact-s;
    p.kpi=p.plan? p.fact/p.plan : null;
    const a=new Map();
    for(const c of p.akb){ const k=normTxt(c.client); const o=a.get(k)||{client:c.client,key:k,amount:0}; o.amount+=c.amount; a.set(k,o); }
    p.akb=[...a.values()].sort((x,y)=>y.amount-x.amount);
  }
  return people.filter(p=>!isHidden(p.name));
}

/* ---------- ФАКТ ИЗ 1С («Оплаты 2026», «Отгрузки 2026») ----------
   Отчёт: строки «Менеджер → Клиент → Сегмент», колонки D… — месяцы 1, 2, 3…, затем «Итого».
   Уровень строки определяем по суммам: клиенты менеджера в сумме дают итог менеджера,
   сегменты клиента — итог клиента. */
const KNOWN_SEGMENTS=new Set(CONFIG.CATEGORY_MAP.flatMap(x=>x[1]).map(normTxt));
function parse1C(rows){
  const totIdx=rows.findIndex(r=>/^итого$/i.test((r[0]||'').trim()));
  if(totIdx<0) throw new Error('в отчёте 1С не найдена строка «Итого»');
  const tr=rows[totIdx];
  // колонки месяцев: по заголовку «1, 2, 3 … Итого», иначе — по сумме в строке «Итого»
  let monthCols=null, monthIdx=null, totCol=null;
  for(const r of rows.slice(0,Math.min(totIdx,12))){
    const mIdx=c=>{ const n=num(c); if(n!=null&&n>=1&&n<=12&&Number.isInteger(n)) return n-1; const t=String(c||'').trim(); return MONTH_RE.findIndex(re=>re.test(t)); };
    // месяцы могут начинаться с любой колонки (в выгрузках 1С бывают пустые колонки B и C, а бывают и нет)
    let j=1; while(j<r.length && mIdx(r[j])<0) j++;
    const cols=[], idx=[];
    while(j<r.length && mIdx(r[j])>=0 && cols.length<12){ idx.push(mIdx(r[j])); cols.push(j); j++; }
    if(cols.length && /итого/i.test(r[j]||'')){ monthCols=cols; monthIdx=idx; totCol=j; break; }
  }
  if(!monthCols){
    let st=1; while(st<tr.length && num(tr[st])==null) st++;
    for(let j=st+1;j<tr.length;j++){
      const v=num(tr[j]); if(v==null) continue;
      let s=0; for(let k=st;k<j;k++) s+=num(tr[k])||0;
      if(Math.abs(s-v)<1){ totCol=j; break; }
    }
    if(totCol==null){ // отчёт без разбивки по месяцам — берём последнюю колонку с суммой
      for(let j=tr.length-1;j>=1;j--) if(num(tr[j])!=null){ totCol=j; break; }
      if(totCol==null) throw new Error('в отчёте 1С не найдена колонка с суммой');
      monthCols=[];
    } else { monthCols=[]; for(let k=st;k<totCol;k++) monthCols.push(k); }
  }
  if(!monthIdx) monthIdx=monthCols.map((c,i)=>i);
  const vals=r=>{ const a=new Array(12).fill(0); monthCols.forEach((c,i)=>{ const k=monthIdx[i]; if(k>=0&&k<12) a[k]+=num(r[c])||0; }); return a; };
  // период отчёта «… - 24.09.2026»
  let asOf=null, from=null;
  for(const r of rows.slice(0,6)) for(const c of r){ const m=String(c).match(/(\d\d)\.(\d\d)\.(\d{4})\s*-\s*(\d\d)\.(\d\d)\.(\d{4})/); if(m && !asOf){ from={y:+m[3],m:+m[2]-1,d:+m[1]}; asOf={y:+m[6],m:+m[5]-1,d:+m[4]}; } }
  const managers=[], segTotals={};
  let curM=null, curC=null, mRem=0, cRem=0;
  const eps=1;
  for(let i=0;i<totIdx;i++){
    const r=rows[i]; const tot=num(r[totCol]); if(tot==null) continue;
    const name=(r[0]||'').trim();
    if(/^(параметры|ответственный|клиент|сегмент|партнер)/i.test(name) && !curM) continue;
    const v=vals(r);
    const isSeg = curC && (Math.abs(cRem)>eps || KNOWN_SEGMENTS.has(normTxt(name)) || name==='');
    if(isSeg){
      const sk=normTxt(name)||'БЕЗ СЕГМЕНТА';
      curC.segs.push({name:sk, v}); cRem-=tot;
      curM.seg[sk]=(curM.seg[sk]||new Array(12).fill(0)).map((x,k)=>x+v[k]);
      curM.segTot[sk]=(curM.segTot[sk]||0)+tot;
      segTotals[sk]=(segTotals[sk]||new Array(12).fill(0)).map((x,k)=>x+v[k]);
      continue;
    }
    if(curM && Math.abs(mRem)>eps){ curC={name, v, segs:[]}; curM.clients.push(curC); cRem=tot; mRem-=tot; continue; }
    curM={name:rename(name), key:personKey(rename(name)), v, tot, clients:[], seg:{}, segTot:{}}; managers.push(curM); mRem=tot; curC=null; cRem=0;
  }
  let total=vals(tr), grand=num(tr[totCol])||0;
  const check=sum(managers.map(m=>sum(m.v)));
  if(Math.abs(check-sum(total))>100) console.warn('1С: сумма по менеджерам',check,'≠ итого',sum(total));
  // убираем из факта сегменты, которые не входят в план (оборудование, роботы)
  const EX=new Set((CONFIG.EXCLUDED_SEGMENTS||[]).map(normTxt));
  let exTot=0; const exV=new Array(12).fill(0);
  for(const m of managers){
    m.excluded=0;
    for(const sk of Object.keys(m.segTot)) if(EX.has(sk)){
      m.excluded+=m.segTot[sk]; m.tot-=m.segTot[sk];
      if(m.seg[sk]) m.seg[sk].forEach((x,k)=>{ m.v[k]-=x; exV[k]+=x; });
    }
    exTot+=m.excluded;
  }
  total=total.map((x,k)=>x-exV[k]); grand-=exTot;
  return {managers, segTotals, total, tot:grand, excluded:exTot, asOf, from, nMonths:monthCols.length};
}

/* ---------- ПЛАН («ПЛАН ПРОДАЖ 2026») ----------
   Блоки: строка «ПОСТУПЛЕНИЯ Д/С» (план оплат), за ней строка «ПРОДАЖИ»/«ОТГРУЗКИ» с именем
   (план отгрузок), ниже — строки номенклатурных направлений. Первый блок — вся компания,
   блоки с «(РП …)» — руководители направлений. */
function parsePlan(rows){
  let head=null, monthCol={}, yearCol=2;
  for(const r of rows.slice(0,10)){
    const mc={}; r.forEach((c,j)=>{ const t=String(c).trim(); const k=MONTH_RE.findIndex(re=>re.test(t)); if(k>=0 && mc[k]==null) mc[k]=j; });
    if(Object.keys(mc).length>=6){ head=r; monthCol=mc; const yc=r.findIndex(c=>/план/i.test(c)); if(yc>=0) yearCol=yc; break; }
  }
  if(!head){ for(let k=0;k<12;k++) monthCol[k]=3+k; }
  const vals=r=>{ const a=new Array(12).fill(0); for(let k=0;k<12;k++) a[k]=num(r[monthCol[k]])||0; return a; };
  const blocks=[]; let pendingPay=null, cur=null;
  for(const r of rows){
    const a=normTxt(r[0]), b=String(r[1]||'').replace(/\s+/g,' ').trim();
    if(/^ПОСТУПЛ/.test(a)){ pendingPay=vals(r); cur=null; continue; }
    if(/^(ПРОДАЖ|ОТГРУЗ)/.test(a)){
      cur={name:b, pay:pendingPay, ship:vals(r), year:num(r[yearCol]), cats:[]};
      blocks.push(cur); pendingPay=null; continue;
    }
    if(cur && !a && b && /[A-Za-zА-Яа-яЁё]/.test(b)){ cur.cats.push({name:b, v:vals(r)}); continue; }
    if(cur && !a && !b) cur=null;
  }
  if(!blocks.length) throw new Error('в плане не найдены блоки «ПОСТУПЛЕНИЯ Д/С» / «ПРОДАЖИ»');
  let ci=blocks.findIndex(b=>/кадкам/i.test(b.name)||!/[А-Яа-яЁё]/.test(b.name)); if(ci<0) ci=0;
  const company=blocks[ci];
  const rps=[], managers=[];
  blocks.forEach((b,i)=>{
    if(i===ci) return;
    const m=b.name.match(/^(.*?)\s*\(\s*РП\s*[«"“]?([^»"”)]*)[»"”]?\s*\)/i);
    if(m) rps.push({...b, person:rename(m[1].trim()), dir:m[2].trim()});
    else if(!isHidden(b.name)) managers.push({...b, name:rename(b.name), key:personKey(rename(b.name))});
  });
  return {company, rps, managers};
}
function segsForCategory(cat){
  const hit=CONFIG.CATEGORY_MAP.find(([re])=>re.test(cat));
  return hit?hit[1].map(normTxt):[];
}

async function findMonth(mo, fallbackSig, fallbackRows, known){
  const names=[];
  if(CONFIG.TABS[mo.key]) names.push(CONFIG.TABS[mo.key]);
  if(known) names.push(known);
  const ld=lastDay(mo.y,mo.m);
  for(const fmt of ['yyyy','yy']) for(let d=ld; d>=Math.max(1,ld-9); d--)
    names.push(`${pad(d)}.${pad(mo.m+1)}.${fmt==='yyyy'?mo.y:String(mo.y).slice(2)}`);

  const first=CONFIG.TABS[mo.key]||known;

    $('opages').innerHTML=d.pages.map(p=>`<div class="page" id="p-${p.slug}" hidden><header class="mh"><div><p class="eyebrow">${esc(p.eb)}</p><h1>${esc(p.name)}</h1>${p.lede?`<p class="lede">${esc(p.lede)}</p>`:''}</div>${p.tier||p.score!=null?`<div class="score">${p.tier?`<span class="pill big ${pillCls(p.tier)}">${esc(p.tier)}</span>`:''}${p.score!=null?`<span class="sc">${p.score}<small>/100</small></span>`:''}</div>`:''}</header>${p.html}</div>`).join('');
    document.querySelectorAll('#otabs a').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); show(a.dataset.p); try{history.replaceState(null,'','#'+a.dataset.p);}catch(_){} window.scrollTo(0,0); }));
    addEventListener('hashchange',()=>show(location.hash.slice(1)));
    show(location.hash.slice(1)||lsGet('otdel.sel','semin'));
    $('lv-status').textContent='Данные на '+d.generated;
    const s=document.createElement('script'); s.textContent=$('live-src').textContent.replace(/<\\\//g,'</'); document.body.appendChild(s);
    try{ (new Function('d',d.js))(d); }catch(e){ console.error(e); }
  }catch(e){ console.error(e); $('opages').innerHTML='<div id="ostat">Данные не загрузились: '+esc(e.message)+'</div>'; }
})();
})();
</script>
</body></html>
